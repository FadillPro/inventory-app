<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Karim Jaya Komputer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a3673 0%, #0d1b3a 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .login-input:focus {
            box-shadow: 0 0 0 3px rgba(26, 54, 115, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md">
        <div class="flex justify-center mb-6">
            <div class="bg-white/10 p-4 rounded-full backdrop-blur-md border border-white/20 shadow-2xl animate-bounce">
                <i class="fa-solid fa-user-shield text-4xl text-white"></i>
            </div>
        </div>

        <div class="glass-card rounded-3xl shadow-2xl overflow-hidden p-10 transform transition duration-500 hover:scale-[1.02]">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-[#1a3673] tracking-tight">Admin Portal</h2>
                <p class="text-gray-500 text-sm mt-2 font-medium">Khusus Otoritas Karim Jaya Komputer</p>
                <div class="h-1 w-16 bg-[#1a3673] mx-auto mt-4 rounded-full"></div>
            </div>

            <form id="adminLoginForm" class="space-y-5">
                <div class="relative">
                    <label class="text-xs font-bold text-[#1a3673] uppercase ml-1 mb-2 block tracking-widest">Username Admin</label>
                    <div class="flex items-center group">
                        <span class="absolute left-4 text-gray-400 group-focus-within:text-[#1a3673] transition-colors">
                            <i class="fa-solid fa-id-badge"></i>
                        </span>
                        <input type="text" id="adminUser" required
                            class="login-input w-full pl-12 pr-4 py-4 rounded-2xl bg-gray-50 border-2 border-gray-100 outline-none transition-all focus:border-[#1a3673] focus:bg-white text-gray-700"
                            placeholder="admin_kj01">
                    </div>
                </div>

                <div class="relative">
                    <label class="text-xs font-bold text-[#1a3673] uppercase ml-1 mb-2 block tracking-widest">Master Password</label>
                    <div class="flex items-center group">
                        <span class="absolute left-4 text-gray-400 group-focus-within:text-[#1a3673] transition-colors">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" id="adminPass" required
                            class="login-input w-full pl-12 pr-4 py-4 rounded-2xl bg-gray-50 border-2 border-gray-100 outline-none transition-all focus:border-[#1a3673] focus:bg-white text-gray-700"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" 
                    class="w-full bg-[#1a3673] text-white py-4 rounded-2xl font-bold text-lg shadow-xl hover:bg-[#254794] transition-all transform active:scale-95 flex items-center justify-center gap-3 mt-4">
                    <span>MASUK PORTAL</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <div class="mt-8 text-center border-t border-gray-100 pt-6">
                <a href="login.html" class="text-sm font-semibold text-gray-400 hover:text-[#1a3673] transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                    Kembali ke Login User
                </a>
            </div>
        </div>

        <p class="text-center text-white/50 text-xs mt-8 tracking-widest">
            &copy; 2026 KARIM JAYA KOMPUTER • SYSTEM V.2.0
        </p>
    </div>

    <script>
        document.getElementById('adminLoginForm').onsubmit = (e) => {
            e.preventDefault();
            const user = document.getElementById('adminUser').value;
            
            // Simpan status admin di localstorage
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("currentUser", user);
            localStorage.setItem("role", "admin");

            // Redirect ke dashboard
            window.location.href = "dashboard.html";
        };
    </script>
</body>
</html>
