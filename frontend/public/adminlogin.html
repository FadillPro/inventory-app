<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Karim Jaya Komputer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #0f2a66, #1e88e5);
        }

        /* KIRI (INFO) */
        .left {
            width: 50%;
            color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left h1 {
            font-size: 40px;
        }

        .left span {
            color: #64b5f6;
        }

        .left p {
            margin-top: 10px;
            opacity: 0.8;
        }

        .feature {
            margin-top: 30px;
        }

        .feature p {
            margin: 10px 0;
        }

        /* KANAN (LOGIN) */
        .right {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 10px;
        }

        .login-box small {
            color: gray;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #1e88e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1565c0;
        }

        .error {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }

        @media(max-width: 768px) {
            .left {
                display: none;
            }

            .right {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- KIRI -->
<div class="left">
    <h1>KARIM JAYA <span>KOMPUTER</span></h1>
    <p>Solusi Komputer Terpercaya</p>

    <div class="feature">
        <p>✔ Produk Berkualitas</p>
        <p>✔ Pelayanan Terbaik</p>
        <p>✔ Support Profesional</p>
    </div>
</div>

<!-- KANAN -->
<div class="right">
    <div class="login-box">
        <h2>Admin Login</h2>
        <small>Karim Jaya Komputer</small>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">LOGIN</button>

        <div class="error" id="error"></div>
    </div>
</div>

<script>
function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    // Simulasi login admin
    if (username === "admin" && password === "karim123") {
        alert("Login berhasil!");
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("error").innerText = "Username atau password salah!";
    }
}
</script>

</body>
</html>
