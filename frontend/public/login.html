<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Karim Jaya Komputer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-[#1a3673] rounded-2xl shadow-xl mb-4 animate__animated animate__bounceIn">
                <i class="fa-solid fa-laptop-code text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-[#1a3673] tracking-tight">Karim Jaya</h1>
            <p class="text-slate-500 text-sm mt-1">Silakan masuk ke akun Anda</p>
        </div>

        <div class="login-card rounded-[2rem] shadow-2xl p-10 transform transition duration-500 hover:shadow-blue-900/10">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Username</label>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#1a3673] transition-colors">
                            <i class="fa-solid fa-user text-sm"></i>
                        </span>
                        <input type="text" id="username" required
                            class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl outline-none focus:border-[#1a3673] focus:ring-4 focus:ring-blue-100 transition-all text-slate-700 placeholder:text-slate-300"
                            placeholder="Masukkan username">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Password</label>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#1a3673] transition-colors">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </span>
                        <input type="password" id="password" required
                            class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl outline-none focus:border-[#1a3673] focus:ring-4 focus:ring-blue-100 transition-all text-slate-700 placeholder:text-slate-300"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-[#1a3673] focus:ring-[#1a3673]">
                        <span class="text-slate-500 group-hover:text-slate-700 transition">Ingat saya</span>
                    </label>
                    <a href="#" class="text-[#1a3673] font-semibold hover:underline">Lupa Password?</a>
                </div>

                <button type="submit" 
                    class="w-full bg-[#1a3673] text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-900/20 hover:bg-[#254794] hover:shadow-xl transition-all transform active:scale-95 flex items-center justify-center gap-2">
                    <span>MASUK SEKARANG</span>
                    <i class="fa-solid fa-circle-arrow-right"></i>
                </button>
            </form>

            <div class="mt-10 text-center border-t border-slate-100 pt-8">
                <p class="text-slate-500 text-sm">
                    Belum punya akun? 
                    <a href="register.html" class="text-[#1a3673] font-bold hover:underline">Daftar di sini</a>
                </p>
            </div>
        </div>

        <div class="mt-8 text-center">
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-[#1a3673] text-sm font-medium transition-colors">
                <i class="fa-solid fa-house-chimney"></i>
                Kembali ke Beranda
            </a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Logika login kamu di sini
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
