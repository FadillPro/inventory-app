<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Karim Jaya Komputer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
        }
        .register-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-lg">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-[#1a3673] tracking-tight flex items-center justify-center gap-3">
                <i class="fa-solid fa-user-plus text-2xl"></i>
                Buat Akun Baru
            </h1>
            <p class="text-slate-500 text-sm mt-2 font-medium">Bergabunglah dengan ekosistem Karim Jaya Komputer</p>
        </div>

        <div class="register-card rounded-[2.5rem] shadow-2xl p-10 border border-white">
            <form id="registerForm" class="space-y-5">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Nama Pengguna</label>
                        <input type="text" required
                            class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-[#1a3673] focus:ring-4 focus:ring-blue-100 transition-all text-sm"
                            placeholder="Contoh: adam_dev">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Role Akses</label>
                        <select class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-[#1a3673] focus:ring-4 focus:ring-blue-100 transition-all text-sm appearance-none">
                            <option value="staff">Staff Inventori</option>
                            <option value="kasir">Kasir Toko</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Email / ID Karyawan</label>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-[#1a3673] transition-colors">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" required
                            class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-[#1a3673] focus:ring-4 focus:ring-blue-100 transition-all text-sm"
                            placeholder="nama@karimjaya.com">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Password</label>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-[#1a3673] transition-colors">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="pass" required
                            class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-[#1a3673] focus:ring-4 focus:ring-blue-100 transition-all text-sm"
                            placeholder="••••••••">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Ulangi Password</label>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-[#1a3673] transition-colors">
                            <i class="fa-solid fa-shield-check"></i>
                        </span>
                        <input type="password" id="confirm_pass" required
                            class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-[#1a3673] focus:ring-4 focus:ring-blue-100 transition-all text-sm"
                            placeholder="••••••••">
                    </div>
                </div>

                <p class="text-[11px] text-slate-400 text-center px-4">
                    Dengan mendaftar, Anda menyetujui <span class="text-[#1a3673] font-bold">Kebijakan Privasi</span> & keamanan data internal Karim Jaya.
                </p>

                <button type="submit" 
                    class="w-full bg-[#1a3673] text-white py-4 rounded-2xl font-bold shadow-xl shadow-blue-900/10 hover:bg-[#254794] hover:shadow-2xl transition-all transform active:scale-95 flex items-center justify-center gap-3">
                    <span>DAFTAR AKUN</span>
                    <i class="fa-solid fa-user-check"></i>
                </button>
            </form>

            <div class="mt-8 text-center border-t border-slate-50 pt-6">
                <p class="text-slate-500 text-sm">
                    Sudah memiliki akses? 
                    <a href="login.html" class="text-[#1a3673] font-bold hover:underline">Masuk di sini</a>
                </p>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-slate-400 hover:text-[#1a3673] text-xs font-semibold transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda
            </a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').onsubmit = (e) => {
            e.preventDefault();
            const p1 = document.getElementById('pass').value;
            const p2 = document.getElementById('confirm_pass').value;

            if(p1 !== p2) {
                alert("Password tidak cocok! Silakan periksa kembali.");
                return;
            }

            alert("Pendaftaran berhasil! Menunggu verifikasi admin.");
            window.location.href = "login.html";
        };
    </script>
</body>
</html>
