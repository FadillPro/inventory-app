<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karim Jaya Komputer</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            cursor: pointer;
        }

        .hero {
            background: linear-gradient(to right, #2563eb, #1e3a8a);
            color: white;
            padding: 80px;
            text-align: center;
        }

        .section {
            padding: 50px;
            text-align: center;
        }

        .services {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 250px;
        }

        footer {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #1e3a8a;
            color: white;
            border: none;
            cursor: pointer;
        }

        .switch {
            margin-top: 10px;
            font-size: 12px;
            cursor: pointer;
            color: blue;
        }
    </style>
</head>

<body>

<header>
    <h1>Karim Jaya Komputer</h1>
    <nav>
        <a onclick="openLogin()">Login</a>
        <a onclick="openAdminLogin()">Admin</a>
    </nav>
</header>

<section class="hero">
    <h2>Selamat Datang</h2>
    <p>Solusi terbaik komputer Anda</p>
</section>

<section class="section">
    <h2>Layanan</h2>
    <div class="services">
        <div class="card">Service Laptop</div>
        <div class="card">Jual Komputer</div>
        <div class="card">Instal Software</div>
    </div>
</section>

<footer>
    <p>&copy; 2026 Karim Jaya Komputer</p>
</footer>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3>Login</h3>
        <input type="text" id="loginUser" placeholder="Username">
        <input type="password" id="loginPass" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="switch" onclick="switchToRegister()">Belum punya akun? Register</div>
    </div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <h3>Register</h3>
        <input type="text" id="regUser" placeholder="Username">
        <input type="password" id="regPass" placeholder="Password">
        <button onclick="register()">Register</button>
        <div class="switch" onclick="switchToLogin()">Sudah punya akun? Login</div>
    </div>
</div>

<!-- ADMIN LOGIN MODAL -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3>Admin Login</h3>
        <input type="text" id="adminUser" placeholder="Username Admin">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="adminLogin()">Login Admin</button>
    </div>
</div>

<script>
function openLogin() {
    document.getElementById("loginModal").style.display = "flex";
}

function openAdminLogin() {
    document.getElementById("adminModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("loginModal").style.display = "none";
    document.getElementById("registerModal").style.display = "none";
    document.getElementById("adminModal").style.display = "none";
}

function switchToRegister() {
    closeModal();
    document.getElementById("registerModal").style.display = "flex";
}

function switchToLogin() {
    closeModal();
    document.getElementById("loginModal").style.display = "flex";
}

function register() {
    let user = document.getElementById("regUser").value;
    let pass = document.getElementById("regPass").value;

    if(user === "" || pass === "") {
        alert("Isi semua field!");
        return;
    }

    localStorage.setItem(user, pass);
    alert("Register berhasil!");
    switchToLogin();
}

function login() {
    let user = document.getElementById("loginUser").value;
    let pass = document.getElementById("loginPass").value;

    let storedPass = localStorage.getItem(user);

    if(storedPass === pass) {
        alert("Login berhasil!");
        closeModal();
    } else {
        alert("Username / Password salah!");
    }
}

function adminLogin() {
    let user = document.getElementById("adminUser").value;
    let pass = document.getElementById("adminPass").value;

    if(user === "admin" && pass === "karim123") {
        alert("Login Admin berhasil!");
        window.location.href = "admin.html";
    } else {
        alert("Login Admin gagal!");
    }
}

window.onclick = function(e) {
    if (e.target.classList.contains('modal')) {
        closeModal();
    }
}
</script>

</body>
</html>
